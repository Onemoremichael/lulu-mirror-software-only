name: Recovery tools
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 mirror.py --help
      - run: python3 tools/check-manifest.py
      - run: bash -n build/container-build.sh
      - run: bash -n build/android-make.sh
      - run: bash -n build/camera-native.sh build/camera-stage.sh
      - run: python3 tools/check-camera.py
