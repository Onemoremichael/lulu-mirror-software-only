<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRROR · Android control</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><p>ORIGINAL BOARD · ANDROID</p><h1>Your mirror, within reach.</h1><div id="status" role="status">Connecting…</div></header>
<section class="workspace"><div class="preview"><img id="screen" alt="Android screen preview. Refresh to load; tap or drag to control." draggable="false"><button id="refresh">Refresh screen</button><label><input type="checkbox" id="auto"> Refresh automatically</label></div>
<div class="controls"><h2>Navigate</h2><div class="row"><button data-key="back">← Back</button><button data-key="home">Home</button><button data-key="recents">Apps</button></div><div class="pad"><button data-key="up">↑</button><div><button data-key="left">←</button><button data-key="select">Select</button><button data-key="right">→</button></div><button data-key="down">↓</button></div><div class="row"><button data-key="wake">Wake</button><button data-key="sleep">Sleep</button></div><h2>Sound</h2><div class="row"><button data-key="volume-down">Volume −</button><button data-key="volume-up">Volume +</button></div><h2>Set up Android</h2><div class="row"><button data-app="settings">Settings</button><button data-app="wifi">Wi-Fi settings</button></div><form id="text-form"><label for="text">Type into the selected Android field</label><input id="text" type="password" autocomplete="off" maxlength="300"><div class="row"><button type="submit">Send text</button><button type="button" data-key="enter">Enter</button></div></form><p class="note">Use the screen preview and directional pad to navigate. The mirror itself has no touch layer. Input goes only to the selected Android device.</p></div></section></main></body></html>
